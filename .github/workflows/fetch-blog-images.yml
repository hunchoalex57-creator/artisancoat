name: Fetch blog images (temporary)
on:
  push:
    paths:
      - ".github/workflows/fetch-blog-images.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exported images
