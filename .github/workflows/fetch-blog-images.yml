      - name: Commit images
        run: |
          git config user.name "hunchoalex57-creator"
          git config user.email "hunchoalex57@gmail.com"
          git add images/blog/poured-concrete-toronto-hero.jpg images/blog/heaved-concrete-walkway-crack-toronto.jpg images/blog/stamped-concrete-walkway-ashlar-slate-gta.jpg images/blog/pouring-concrete-steps-rebar-forms-toronto.jpg
